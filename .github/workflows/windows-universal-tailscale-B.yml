name: windows-universal-tailscale-B

on:
  workflow_dispatch:
    inputs:
      # --- Tailscale & Handoff Settings ---
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale auth key (reusable or ephemeral)"
        required: true
      gh_api_token:
        description: "GitHub Personal Access Token (classic; scopes: repo, workflow)"
        required: true
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"

      # --- OS Selection ---
      os_version:
        description: "Select Windows OS Version"
        type: choice
        options:
          - "windows-2022"
          - "windows-2025"
        default: "windows-2022"

      # --- Connection Options ---
      enable_rdp:
        description: "Enable Remote Desktop (RDP)"
        type: boolean
        default: true
      enable_anydesk:
        description: "Enable AnyDesk"
        type: boolean
        default: true
      enable_rustdesk:
        description: "Enable RustDesk"
        type: boolean
        default: false
      enable_avica:
        description: "Enable Avica Remote"
        type: boolean
        default: false
      enable_vnc:
        description: "Enable UltraVNC Server"
        type: boolean
        default: false

      # --- Additional Features & Applications ---
      audio:
        description: "Install VB-Cable Audio Driver"
        type: boolean
        default: true
      dark:
        description: "Enable Dark Mode Theme & Wallpaper"
        type: boolean
        default: false
      store:
        description: "Add Microsoft Store"
        type: boolean
        default: false
      vscode:
        description: "Add Visual Studio Code"
        type: boolean
        default: false
      media:
        description: "Add PotPlayer and AIMP"
        type: boolean
        default: false
      social:
        description: "Add Telegram & Discord"
        type: boolean
        default: false
      optimize:
        description: "Optimize Windows Performance (O&O ShutUp10)"
        type: boolean
        default: false
      rar:
        description: "Add WinRAR"
        type: boolean
        default: false
      qbit:
        description: "Add qBittorrent"
        type: boolean
        default: false
      office:
        description: "Add Microsoft Office 365 + MAS Activation"
        type: boolean
        default: false
      llm:
        description: "Add LM Studio"
        type: boolean
        default: false
      vmware:
        description: "Add VMware Workstation Pro"
        type: boolean
        default: false
      ninite_bool:
        description: "Install Custom Ninite Package"
        type: boolean
        default: false
      ninite_url:
        description: "Direct Ninite installer URL"
        required: false
        type: string

  workflow_run:
    workflows: ["windows-universal-tailscale A"]
    types: [completed]

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet

jobs:
  universal-runner:
    runs-on: ${{ inputs.os_version || 'windows-2022' }}
    timeout-minutes: 370
    steps:
      - name: 🔧 Resolve Inputs & Configuration
        id: cfg
        env:
          RAW_TAILNET: ${{ inputs.ts_tailnet }}
          RAW_APIKEY: ${{ inputs.ts_api_key }}
          RAW_AUTHKEY: ${{ inputs.ts_authkey }}
          RAW_PAT: ${{ inputs.gh_api_token }}
          RAW_TEST: ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME: ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS: ${{ inputs.loops || '0' }}
        run: |
          function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }
          $tailnet = $env:RAW_TAILNET
          $apiKey  = $env:RAW_APIKEY
          $authKey = $env:RAW_AUTHKEY
          $pat     = $env:RAW_PAT

          if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) {
            Write-Error "Missing required inputs"; exit 1
          }

          $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')
          $runtime = ToIntOr $env:RAW_RUNTIME 355
          if ($isTest) { $runtime = 5 }
          if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
          if ($runtime -gt 360) { $runtime = 355 }

          $loops = ToIntOr $env:RAW_LOOPS 0
          if ($loops -lt 0) { $loops = 0 }

          "tailnet=$tailnet" | Out-File -Append $env:GITHUB_OUTPUT
          "apikey=$apiKey"   | Out-File -Append $env:GITHUB_OUTPUT
          "authkey=$authKey" | Out-File -Append $env:GITHUB_OUTPUT
          "pat=$pat"         | Out-File -Append $env:GITHUB_OUTPUT
          "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
          "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT

      - name: ⚙️ Install Tailscale (if missing)
        run: |
          $exe = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $exe)) {
            $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
            $dst = "$env:TEMP\tailscale-setup.exe"
            Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
            Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
          }
          Start-Service Tailscale -ErrorAction SilentlyContinue

      - name: 🧹 PURGE Stale Devices
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          $match = { param($d) ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet') }
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (& $match $d) {
                try {
                  Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
                  Write-Host "Deleted stale Tailscale device: $($d.name)"
                } catch {}
              }
            }
          } catch { Write-Warning "Startup purge failed: $_" }

      - name: 🔗 Tailscale Up (Static Hostname: bullet)
        id: up
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout | Out-Null
          & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          Start-Sleep -Seconds 2
          $ip4 = (& $ts ip -4 | Select-Object -First 1)
          $status = & $ts status --json | ConvertFrom-Json
          "ip4=$ip4"   | Out-File -Append $env:GITHUB_OUTPUT
          "TAILSCALE_IP=$ip4" | Out-File -Append $env:GITHUB_ENV

      # --- CONNECTION IMPLEMENTATIONS ---

      - name: 🔐 Configure RDP
        if: ${{ inputs.enable_rdp }}
        run: |
          $u="${{ env.RDP_USER }}"; $p="${{ env.RDP_PASS }}"
          $sec = ConvertTo-SecureString $p -AsPlainText -Force
          if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
          } else {
            Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
            Enable-LocalUser -Name $u
          }
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: 🖥️ Configure AnyDesk
        if: ${{ inputs.enable_anydesk }}
        shell: cmd
        run: |
          powershell -Command "Invoke-WebRequest -Uri 'https://download.anydesk.com/AnyDesk.exe' -OutFile 'AnyDesk.exe'"
          AnyDesk.exe --install "C:\AnyDesk" --start-with-win --silent
          powershell -Command "Start-Sleep -Seconds 15"
          set "adPath=C:\AnyDesk\AnyDesk.exe"
          :START_ANYDESK
          start "" "%adPath%" --start
          powershell -Command "Start-Sleep -Seconds 5"
          for /f "delims=" %%i in ('"%adPath%" --get-id') do ( set "ID=%%i" )
          if "%ID%"=="" goto START_ANYDESK
          if "%ID%"=="0" goto START_ANYDESK
          "%adPath%" --set-password MR.English2008
          echo ANYDESK_ID=%ID% >> %GITHUB_ENV%

      - name: 🦀 Configure RustDesk
        if: ${{ inputs.enable_rustdesk }}
        run: |
          $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi"
          $installerPath = "$env:TEMP\rustdesk.msi"
          Invoke-WebRequest -Uri $rdUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          & "C:\Program Files\RustDesk\rustdesk.exe" --password "MR.English2008"
          Start-Sleep -Seconds 5
          & "C:\Program Files\RustDesk\rustdesk.exe" --get-id | Out-File -FilePath "$env:TEMP\id.txt"
          $rdID = (Get-Content "$env:TEMP\id.txt").Trim()
          "RUSTDESK_ID=$rdID" | Out-File -Append $env:GITHUB_ENV
          netsh advfirewall firewall add rule name="RustDesk-TCP" dir=in action=allow protocol=TCP localport=21115-21119
          netsh advfirewall firewall add rule name="RustDesk-UDP" dir=in action=allow protocol=UDP localport=21116

      - name: 🦅 Configure Avica
        if: ${{ inputs.enable_avica }}
        run: |
          curl.exe -s -L -o AvicaLite.exe https://download.avica.com/AvicaLite_v8.0.8.9.exe
          Start-Process -FilePath ".\AvicaLite.exe"

      - name: 👁️ Configure UltraVNC
        if: ${{ inputs.enable_vnc }}
        run: |
          choco install ultravnc -y
          $vncPath = "C:\Program Files\UltraVNC"
          if (!(Test-Path $vncPath)) { $vncPath = "C:\Program Files\uvnc bvba\UltraVNC" }
          $iniFile = "$vncPath\ultravnc.ini"
          Invoke-WebRequest -Uri "https://gitlab.com/MR.English2008/avica/-/raw/main/ultravnc.ini" -OutFile $iniFile
          Set-Location $vncPath
          ./winvnc.exe -install
          Start-Sleep -Seconds 3
          Start-Service -Name "uvnc_service" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "UltraVNC_Automated" -Direction Inbound -Action Allow -Protocol TCP -LocalPort 5900 -ErrorAction SilentlyContinue

      # --- FEATURE & APPLICATION INSTALLATIONS ---

      - name: 🔊 VB-Cable Audio Driver
        if: ${{ inputs.audio }}
        run: |
          $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip"
          $zipPath = "$env:TEMP\VBCABLE.zip"
          $extractPath = "$env:TEMP\VBCABLE"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Set-Location $extractPath
          $sig = Get-AuthenticodeSignature ".\VBCABLE_Setup_x64.exe"
          if ($sig.SignerCertificate) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "TrustedPublisher", "LocalMachine"
              $store.Open("ReadWrite")
              $store.Add($sig.SignerCertificate)
              $store.Close()
          }
          Start-Process -FilePath ".\VBCABLE_Setup_x64.exe" -ArgumentList "-i", "-h" -Wait

      - name: 🎨 Theme & Wallpaper Configuration
        run: |
          $mode = if (${{ inputs.dark }}) { "Dark" } else { "Light" }
          if (${{ inputs.dark }}) {
            Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Type Dword
            Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Type Dword
          }
          $url = "https://raw.githubusercontent.com/AHL8192/special-octo-enigma/refs/heads/main/Wallpapers/$mode.jpg"
          $outputPath = "$env:TEMP\wallpaper.jpg"
          Invoke-WebRequest -Uri $url -OutFile $outputPath -ErrorAction SilentlyContinue
          $code = @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          Add-Type -TypeDefinition $code -ErrorAction SilentlyContinue
          [Wallpaper]::SystemParametersInfo(0x0014, 0, $outputPath, 0x03)

      - name: 🏪 Microsoft Store
        if: ${{ inputs.store }}
        run: |
          wsreset -i
          Start-Sleep -Seconds 15

      - name: ⚡ Performance Optimization (O&O ShutUp10)
        if: ${{ inputs.optimize }}
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Stop-Service -Name WSearch, SysMain -ErrorAction SilentlyContinue
          Set-Service -Name WSearch, SysMain -StartupType Disabled -ErrorAction SilentlyContinue
          $OOSU_exe = "$env:TEMP\OOSU10.exe"
          $OOSU_cfg = "$env:TEMP\ooshutup10.cfg"
          Invoke-WebRequest -Uri "https://dl5.oo-software.com/files/ooshutup10/OOSU10.exe" -OutFile $OOSU_exe
          "P001 + P002 + P003 + P004 + P005 + P006 + P008 + P026 + P027 + P028 + P064 + P065 + P066 + P067 + P070 + P069 + P009 - P010 - P015 - P068 - P016 - A001 + A002 + A003 + A004 + A006 + A005 + P007 + P036 + P025 + P033 + P023 + P056 + P057 - P012 - P034 - P013 - P035 - P062 - P063 - P081 - P047 - P019 - P048 - P049 - P020 - P037 - P011 - P038 - P050 - P051 - P018 - P039 - P021 - P040 - P022 - P041 - P014 - P042 - P052 - P053 - P054 - P055 - P029 - P043 - P030 - P044 - P031 - P045 - P032 - P046 - P058 - P059 - P060 - P061 - P024 - S001 + S002 + S003 + S008 - E001 + E002 + E003 + E008 + E007 + E010 + E011 + E012 + E009 - E004 - E005 - E013 - E014 - E006 - Y001 + Y002 + Y003 + Y004 + Y005 + Y006 + Y007 + C012 + C002 + C013 + C007 + C008 + C009 + C010 + C011 + C014 + C015 + L001 + L003 + L004 - L005 - U001 + U004 + U005 + U006 + U007 + W001 + W011 +" | Out-File $OOSU_cfg
          Start-Process -FilePath $OOSU_exe -ArgumentList "`"$OOSU_cfg`" /quiet /nosrp" -Wait -NoNewWindow

      - name: 📦 Install Requested Software
        run: |
          if (${{ inputs.vscode }}) { winget install --id Microsoft.VisualStudioCode -e --silent --accept-source-agreements --accept-package-agreements }
          if (${{ inputs.media }}) { 
            winget install --id XP8BSBGQW2DKS0 -e --silent --accept-source-agreements --accept-package-agreements
            winget install --id 9PCLLLH15SMT -e --silent --accept-source-agreements --accept-package-agreements
          }
          if (${{ inputs.social }}) {
            winget install --id Telegram.TelegramDesktop -e --silent --accept-source-agreements --accept-package-agreements
            winget install --id Discord.Discord -e --silent --accept-source-agreements --accept-package-agreements
          }
          if (${{ inputs.llm }}) { winget install --id ElementLabs.LMStudio -e --silent --accept-source-agreements --accept-package-agreements }
          if (${{ inputs.rar }}) { choco install winrar -y }

      - name: 💻 VMware Workstation Pro
        if: ${{ inputs.vmware }}
        run: |
          $exePath = "$env:TEMP\vmware_installer.exe"
          Invoke-WebRequest -Uri "https://github.com/AHL8192/special-octo-enigma/releases/download/v1.0.1/OpmaticOceanicVersion1.0.1.exe" -OutFile $exePath -UserAgent "Mozilla/5.0"
          Start-Process -FilePath $exePath -ArgumentList '/s /v"/qn EULAS_AGREED=1 AUTOSOFTWAREUPDATE=0 DATACOLLECTION=0"' -Wait

      - name: 📥 qBittorrent
        if: ${{ inputs.qbit }}
        run: |
          $releaseInfo = Invoke-RestMethod -Uri "https://api.github.com/repos/qbittorrent/qBittorrent/releases/latest"
          $asset = $releaseInfo.assets | Where-Object { $_.name -match "x64_setup\.exe$" } | Select-Object -First 1
          $outputFile = "$env:TEMP\qbittorrent_setup.exe"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outputFile
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$outputFile`" /S /D=D:\Program Files\qBittorrent" -Wait -NoNewWindow

      - name: 💼 Microsoft Office & Activation
        if: ${{ inputs.office }}
        run: |
          $exe = 'OfficeSetup.exe'
          Invoke-WebRequest -Uri 'https://c2rsetup.officeapps.live.com/c2r/download.aspx?ProductreleaseID=O365ProPlusRetail&platform=x64&language=en-us&version=O16GA' -OutFile $exe -UseBasicParsing
          '<Configuration><Add OfficeClientEdition="64"><Product ID="O365ProPlusRetail"><Language ID="en-us" /></Product></Add><Display Level="None" AcceptEULA="TRUE" /></Configuration>' | Out-File 'configuration.xml' -Encoding UTF8
          Start-Process -FilePath ".\$exe" -ArgumentList "/configure `"configuration.xml`"" -Wait
          git clone https://github.com/AHL8192/Microsoft-Activation-Scripts.git
          Set-Location .\Microsoft-Activation-Scripts\MAS\Separate-Files-Version\Activators
          .\Ohook_Activation_AIO.cmd

      - name: 🚀 Custom Ninite Installer
        if: ${{ inputs.ninite_bool }}
        env:
          NINITE_URL: ${{ inputs.ninite_url }}
        run: |
          if ($env:NINITE_URL) {
            Invoke-WebRequest -Uri $env:NINITE_URL -OutFile "NiniteInstaller.exe"
            Start-Process -FilePath ".\NiniteInstaller.exe"
          }

      - name: 📊 Status & Summary
        run: |
          Write-Host "========================================"
          Write-Host "UNIVERSAL RUNNER (B) READY"
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Hostname     : $env:TS_HOSTNAME"
          if ($env:ANYDESK_ID)  { Write-Host "AnyDesk ID   : $env:ANYDESK_ID" }
          if ($env:RUSTDESK_ID) { Write-Host "RustDesk ID  : $env:RUSTDESK_ID" }
          Write-Host "Default Pass : MR.English2008 / Bullet@12345"
          Write-Host "========================================"

      - name: ⏳ Keep Alive Loop
        run: |
          $mins = [int]"${{ steps.cfg.outputs.runtime }}"
          $end = (Get-Date).AddMinutes($mins)
          while((Get-Date) -lt $end){
            $left = [int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
            Write-Host "Runner (B) active... ($left min remaining)"
            Start-Sleep -Seconds 60
          }

      - name: 🧹 Exit Purge
        if: always()
        run: |
          $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
          $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
          $match = { param($d) ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet') }
          try {
            $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
            foreach ($d in $resp.devices) {
              if (& $match $d) {
                try { Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null } catch {}
              }
            }
          } catch {}

      - name: 🔁 Dispatch Workflow A (Handoff)
        if: always()
        run: |
          $loops = [int]"${{ steps.cfg.outputs.loops }}"
          if ($loops -eq 1) { Write-Host "Loops completed; handoff stopped."; exit 0 }
          $next = if ($loops -gt 1) { $loops - 1 } else { 0 }
          $token = "${{ steps.cfg.outputs.pat }}"
          
          $body = @{
            ref = "${{ github.ref_name }}"
            inputs = @{
              ts_tailnet      = "${{ steps.cfg.outputs.tailnet }}"
              ts_api_key      = "${{ steps.cfg.outputs.apikey }}"
              ts_authkey      = "${{ steps.cfg.outputs.authkey }}"
              gh_api_token    = "$token"
              test_mode       = "false"
              runtime_minutes = "${{ steps.cfg.outputs.runtime }}"
              loops           = "$next"
              os_version      = "${{ inputs.os_version }}"
              enable_rdp      = "${{ inputs.enable_rdp }}"
              enable_anydesk  = "${{ inputs.enable_anydesk }}"
              enable_rustdesk = "${{ inputs.enable_rustdesk }}"
              enable_avica    = "${{ inputs.enable_avica }}"
              enable_vnc      = "${{ inputs.enable_vnc }}"
              audio           = "${{ inputs.audio }}"
              dark            = "${{ inputs.dark }}"
              store           = "${{ inputs.store }}"
              vscode          = "${{ inputs.vscode }}"
              media           = "${{ inputs.media }}"
              social          = "${{ inputs.social }}"
              optimize        = "${{ inputs.optimize }}"
              rar             = "${{ inputs.rar }}"
              qbit            = "${{ inputs.qbit }}"
              office          = "${{ inputs.office }}"
              llm             = "${{ inputs.llm }}"
              vmware          = "${{ inputs.vmware }}"
              ninite_bool     = "${{ inputs.ninite_bool }}"
              ninite_url      = "${{ inputs.ninite_url }}"
            }
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-universal-tailscale-A.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $body
