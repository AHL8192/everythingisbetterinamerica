name: Ubuntu RDP via Tailscale (B)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale auth key (reusable or ephemeral)"
        required: true
      gh_api_token:
        description: "GitHub Personal Access Token (classic; scopes: repo, workflow)"
        required: true
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: bash

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: 🔧 Resolve inputs (safe)
        id: cfg
        run: |
          function to_int_or() {
            if [[ "$1" =~ ^[0-9]+$ ]]; then echo "$1"; else echo "$2"; fi
          }
          
          TAILNET="${{ inputs.ts_tailnet }}"
          APIKEY="${{ inputs.ts_api_key }}"
          AUTHKEY="${{ inputs.ts_authkey }}"
          PAT="${{ inputs.gh_api_token }}"
          RAW_TEST="${{ inputs.test_mode }}"
          
          if [[ -z "$TAILNET" || -z "$APIKEY" || -z "$AUTHKEY" || -z "$PAT" ]]; then
            echo "Missing required inputs"
            exit 1
          fi
          
          if [[ "$RAW_TEST" == "true" ]]; then
            RUNTIME=5
          else
            RUNTIME=$(to_int_or "${{ inputs.runtime_minutes }}" 355)
            if [[ "$RUNTIME" -lt 6 ]]; then RUNTIME=355; fi
            if [[ "$RUNTIME" -gt 360 ]]; then RUNTIME=355; fi
          fi
          
          LOOPS=$(to_int_or "${{ inputs.loops }}" 0)
          if [[ "$LOOPS" -lt 0 ]]; then LOOPS=0; fi
          
          echo "tailnet=$TAILNET" >> $GITHUB_OUTPUT
          echo "apikey=$APIKEY" >> $GITHUB_OUTPUT
          echo "authkey=$AUTHKEY" >> $GITHUB_OUTPUT
          echo "pat=$PAT" >> $GITHUB_OUTPUT
          echo "runtime=$RUNTIME" >> $GITHUB_OUTPUT
          echo "loops=$LOOPS" >> $GITHUB_OUTPUT
          
          echo "Resolved: test=$RAW_TEST, runtime=$RUNTIME, loops=$LOOPS"

      - name: ⚙️ Install Tailscale & show version
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale version


      - name: 🔐 Enable RDP user + Install XRDP/XFCE4
        run: |
          U="${{ env.RDP_USER }}"
          P="${{ env.RDP_PASS }}"
          
          # Create user and assign password
          if ! id -u "$U" > /dev/null 2>&1; then
            sudo useradd -m -s /bin/bash "$U"
            sudo usermod -aG sudo "$U"
          fi
          echo "$U:$P" | sudo chpasswd
          
          # Install lightweight desktop and xrdp
          sudo apt-get update
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          
          # Fix failsafe session error and permission denied errors using sudo tee
          echo "unset SESSION_MANAGER" | sudo tee /home/$U/.xsession > /dev/null
          echo "unset DBUS_SESSION_BUS_ADDRESS" | sudo tee -a /home/$U/.xsession > /dev/null
          echo "exec dbus-launch --exit-with-session startxfce4" | sudo tee -a /home/$U/.xsession > /dev/null
          
          sudo chown $U:$U /home/$U/.xsession
          sudo adduser xrdp ssl-cert
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp


      - name: 🧹 PURGE any devices containing 'bullet' (startup)
        run: |
          ENCODED_TAILNET=$(jq -rn --arg x "${{ steps.cfg.outputs.tailnet }}" '$x|@uri')
          DEVICES=$(curl -s -H "Authorization: Bearer ${{ steps.cfg.outputs.apikey }}" "https://api.tailscale.com/api/v2/tailnet/$ENCODED_TAILNET/devices")
          
          # Check if the response contains devices before looping
          if echo "$DEVICES" | jq -e '.devices' > /dev/null; then
            echo "$DEVICES" | jq -r '.devices[] | select(.name | test("bullet"; "i")) | .id' | while read -r dev_id; do
              curl -s -X DELETE -H "Authorization: Bearer ${{ steps.cfg.outputs.apikey }}" "https://api.tailscale.com/api/v2/device/$dev_id" > /dev/null
              echo "Deleted device at start: $dev_id"
            done
          else
            echo "No devices found or error in Tailscale API response."
          fi

      - name: 🔗 Tailscale up (hostname=bullet) + show IP/FQDN/DERP
        id: up
        run: |
          sudo tailscale logout 2>/dev/null || true
          sudo tailscale up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
          sleep 2
          
          IP4=$(sudo tailscale ip -4 | head -n 1)
          STATUS=$(sudo tailscale status --json)
          FQDN=$(echo "$STATUS" | jq -r '.Self.DNSName')
          DERP=$(echo "$STATUS" | jq -r '.Self.DERP')
          
          echo "ip4=$IP4" >> $GITHUB_OUTPUT
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT
          echo "derp=$DERP" >> $GITHUB_OUTPUT
          
          echo "### RDP Ubuntu (A)
          Host: ${{ env.TS_HOSTNAME }}
          IPv4: $IP4
          MagicDNS: $FQDN
          DERP: $DERP
          User: ${{ env.RDP_USER }}
          Pass: ${{ env.RDP_PASS }}" >> $GITHUB_STEP_SUMMARY

      - name: ⏳ Keep alive
        run: |
          RUNTIME_MINS="${{ steps.cfg.outputs.runtime }}"
          END_TIME=$(( $(date +%s) + (RUNTIME_MINS * 60) ))
          
          while [ $(date +%s) -lt $END_TIME ]; do
            LEFT=$(( ($END_TIME - $(date +%s)) / 60 ))
            echo "RDP alive... ($LEFT min left)"
            sleep 60
          done

      - name: 🧹 PURGE any devices containing 'bullet' (exit)
        if: always()
        run: |
          ENCODED_TAILNET=$(jq -rn --arg x "${{ steps.cfg.outputs.tailnet }}" '$x|@uri')
          DEVICES=$(curl -s -H "Authorization: Bearer ${{ steps.cfg.outputs.apikey }}" "https://api.tailscale.com/api/v2/tailnet/$ENCODED_TAILNET/devices")
          
          if echo "$DEVICES" | jq -e '.devices' > /dev/null; then
            echo "$DEVICES" | jq -r '.devices[] | select(.name | test("bullet"; "i")) | .id' | while read -r dev_id; do
              curl -s -X DELETE -H "Authorization: Bearer ${{ steps.cfg.outputs.apikey }}" "https://api.tailscale.com/api/v2/device/$dev_id" > /dev/null
              echo "Deleted device at exit: $dev_id"
            done
          fi

      - name: 🔁 Dispatch workflow A (instant, forever by default)
        if: always()
        run: |
          LOOPS="${{ steps.cfg.outputs.loops }}"
          if [ "$LOOPS" -eq 1 ]; then
            echo "Loops finished; not dispatching."
            exit 0
          fi
          
          if [ "$LOOPS" -gt 1 ]; then
            NEXT=$((LOOPS - 1))
          else
            NEXT=0
          fi
          
          PAT="${{ steps.cfg.outputs.pat }}"
          PAYLOAD=$(jq -n \
            --arg ref "${{ github.ref_name }}" \
            --arg tailnet "${{ steps.cfg.outputs.tailnet }}" \
            --arg apikey "${{ steps.cfg.outputs.apikey }}" \
            --arg authkey "${{ steps.cfg.outputs.authkey }}" \
            --arg pat "$PAT" \
            --arg runtime "${{ steps.cfg.outputs.runtime }}" \
            --arg loops "$NEXT" \
            '{
              ref: $ref,
              inputs: {
                ts_tailnet: $tailnet,
                ts_api_key: $apikey,
                ts_authkey: $authkey,
                gh_api_token: $pat,
                test_mode: "false",
                runtime_minutes: $runtime,
                loops: $loops
              }
            }')
          
          curl -s -X POST \
            -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ubuntu-rdp-tailscale-A.yml/dispatches" \
            -d "$PAYLOAD"
