name: Windows RDP via Tailscale (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin, no 'Bearer')"
        required: true
      ts_authkey:
        description: "Tailscale auth key (reusable or ephemeral)"
        required: true
      gh_api_token:
        description: "GitHub Personal Access Token (classic; scopes: repo, workflow)"
        required: true
      test_mode:
        description: "Run 5-minute test loop"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime in minutes (max 360; capped to 355)"
        required: false
        default: "355"
      loops:
        description: "How many handoffs (0 = infinite)"
        required: false
        default: "0"
      audio:
        description: 'Install VB-Cable Audio Driver (14s)'
        type: boolean
        default: true
      dark:
        description: 'Dark Mode (7s)'
        type: boolean
        default: true
      store:
        description: 'Add Microsoft Store (23s)'
        type: boolean
        default: true
      vscode:
        description: 'Add vscode (1m 19s)'
        type: boolean
        default: true
      media:
        description: 'Add PotPlayer and AIMP (32s)'
        type: boolean
        default: true
      social:
        description: 'Add Telegram & Discord (1m 16s)'
        type: boolean
        default: true
      optimize:
        description: 'Optimize windows performance (1m 46s)'
        type: boolean
        default: true
      rar:
        description: 'Add WinRAR (14s)'
        type: boolean
        default: true
      qbit:
        description: 'Add qbittorrent (9s)'
        type: boolean
        default: true
      office:
        description: 'Add Microsoft Office (4m 8s)'
        type: boolean
        default: true
      llm:
        description: 'Add LLM Studio (2m 7s)'
        type: boolean
        default: true
      vmware:
        description: 'Add VMware Workstation Pro (6m 24s)'
        type: boolean
        default: false
      ninite_bool:
        description: 'Add More Apps - Open https://ninite.com/ to choose your apps.'
        type: boolean
        default: false
      ninite_url:
        description: 'Give us a direct link to the customized installer from Ninite.'
        required: false
        type: string

concurrency:
  group: tailscale-rdp-singleton
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

env:
  RDP_USER: Bullettemporary
  RDP_PASS: Bullet@12345
  TS_HOSTNAME: bullet

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 370
    steps:
      - name: 🔧 Resolve inputs (safe)
        id: cfg
        env:
          RAW_TAILNET:  ${{ inputs.ts_tailnet }}
          RAW_APIKEY:   ${{ inputs.ts_api_key }}
          RAW_AUTHKEY:  ${{ inputs.ts_authkey }}
          RAW_PAT:      ${{ inputs.gh_api_token }}
          RAW_TEST:     ${{ inputs.test_mode == true && 'true' || 'false' }}
          RAW_RUNTIME:  ${{ inputs.runtime_minutes || '355' }}
          RAW_LOOPS:    ${{ inputs.loops || '0' }}
        run: |
            function ToIntOr($v, $def){ if("$v" -match '^\d+$'){[int]$v}else{[int]$def} }
            $tailnet = $env:RAW_TAILNET
            $apiKey  = $env:RAW_APIKEY
            $authKey = $env:RAW_AUTHKEY
            $pat     = $env:RAW_PAT
            if (-not $tailnet -or -not $apiKey -or -not $authKey -or -not $pat) {
              Write-Error "Missing required inputs"; exit 1
            }
            $isTest = ($env:RAW_TEST -match '^(?i:true|1|yes|on)$')
            $runtime = ToIntOr $env:RAW_RUNTIME 355
            if ($isTest) { $runtime = 5 }
            if (-not $isTest -and $runtime -lt 6) { $runtime = 355 }
            if ($runtime -gt 360) { $runtime = 355 }
            $loops = ToIntOr $env:RAW_LOOPS 0
            if ($loops -lt 0) { $loops = 0 }
            "tailnet=$tailnet" | Out-File -Append $env:GITHUB_OUTPUT
            "apikey=$apiKey"   | Out-File -Append $env:GITHUB_OUTPUT
            "authkey=$authKey" | Out-File -Append $env:GITHUB_OUTPUT
            "pat=$pat"         | Out-File -Append $env:GITHUB_OUTPUT
            "runtime=$runtime" | Out-File -Append $env:GITHUB_OUTPUT
            "loops=$loops"     | Out-File -Append $env:GITHUB_OUTPUT
            Write-Host "Resolved: test=$isTest, runtime=$runtime, loops=$loops"

      - name: ⚙️ Install Tailscale (if missing) & show version
        run: |
            $exe = "C:\Program Files\Tailscale\tailscale.exe"
            if (-not (Test-Path $exe)) {
              $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe'
              $dst = "$env:TEMP\tailscale-setup.exe"
              Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing
              Start-Process -FilePath $dst -ArgumentList "/quiet" -Wait
            }
            Start-Service Tailscale -ErrorAction SilentlyContinue
            & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: 🔐 Enable RDP user + firewall
        run: |
            $u="${{ env.RDP_USER }}"; $p="${{ env.RDP_PASS }}"
            $sec = ConvertTo-SecureString $p -AsPlainText -Force
            if (-not (Get-LocalUser -Name $u -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $u -Password $sec -AccountNeverExpires
              Add-LocalGroupMember -Group Administrators -Member $u
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u
            } else {
              Set-LocalUser -Name $u -Password $sec -AccountNeverExpires
              Enable-LocalUser -Name $u
            }
            Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
            Enable-NetFirewallRule -DisplayGroup "Remote Desktop" | Out-Null

      - name: 🧹 PURGE any devices containing 'bullet' (startup)
        run: |
            $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
            $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
            $match = { param($d)
              ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')
            }
            try {
              $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
              foreach ($d in $resp.devices) {
                if (& $match $d) {
                  try {
                    Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
                    Write-Host "Deleted at start: $($d.name)"
                  } catch {}
                }
              }
            } catch { Write-Warning "Startup purge failed: $_" }

      - name: 🔗 Tailscale up (hostname=bullet) + show IP/FQDN/DERP
        id: up
        run: |
            $ts = "C:\Program Files\Tailscale\tailscale.exe"
            & $ts logout | Out-Null
            & $ts up --authkey "${{ steps.cfg.outputs.authkey }}" --hostname "${{ env.TS_HOSTNAME }}" --accept-routes --accept-dns=false
            Start-Sleep -Seconds 2
            $ip4 = (& $ts ip -4 | Select-Object -First 1)
            $status = & $ts status --json | ConvertFrom-Json
            $fqdn = $status.Self.DNSName
            $derp = $status.Self.DERP
            "ip4=$ip4"   | Out-File -Append $env:GITHUB_OUTPUT
            "fqdn=$fqdn" | Out-File -Append $env:GITHUB_OUTPUT
            "derp=$derp" | Out-File -Append $env:GITHUB_OUTPUT
            "### RDP (A)`nHost: $env:TS_HOSTNAME`nIPv4: $ip4`nMagicDNS: $fqdn`nDERP: $derp`nUser: $env:RDP_USER`nPass: $env:RDP_PASS" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # -----------------------------------------------------------
      # START OF INJECTED APP INSTALLATION FEATURES
      # -----------------------------------------------------------
      - name: Add VB-Cable Audio Driver
        shell: powershell
        if: ${{ inputs.audio }}
        run: |
          $url = "https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip"
          $zipPath = "$env:TEMP\VBCABLE_Driver_Pack45.zip"
          $extractPath = "$env:TEMP\VBCABLE"
          Write-Host "Downloading VB-Cable..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Write-Host "Extracting ZIP..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Set-Location $extractPath
          Write-Host "Trusting VB-Audio signature..."
          $sig = Get-AuthenticodeSignature ".\VBCABLE_Setup_x64.exe"
          if ($sig.SignerCertificate) {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "TrustedPublisher", "LocalMachine"
              $store.Open("ReadWrite")
              $store.Add($sig.SignerCertificate)
              $store.Close()
              Write-Host "Certificate added to TrustedPublisher."
          } else {
              Write-Warning "Could not extract certificate. Installation might hang if Windows prompts for trust."
          }
          Write-Host "Installing VB-Cable driver..."
          $process = Start-Process -FilePath ".\VBCABLE_Setup_x64.exe" -ArgumentList "-i", "-h" -Wait -PassThru
          if ($process.ExitCode -eq 0) {
              Write-Host "VB-Cable Installation completed successfully!"
          } else {
              Write-Error "Installation exited with code $($process.ExitCode)."
              exit 1
          }

      - name: Light Mode
        shell: powershell
        if: ${{ !inputs.dark }}
        run: |
          $url = "https://raw.githubusercontent.com/AHL8192/special-octo-enigma/refs/heads/main/Wallpapers/Light.jpg"
          $outputPath = "$env:TEMP\github_wallpaper.jpg"
          Invoke-WebRequest -Uri $url -OutFile $outputPath
          $code = @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          Add-Type -TypeDefinition $code -ErrorAction SilentlyContinue
          [Wallpaper]::SystemParametersInfo(0x0014, 0, $outputPath, 0x03)

      - name: Dark Mode
        shell: powershell
        if: ${{ inputs.dark }}
        run: |
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'AppsUseLightTheme' -Value 0 -Type Dword
          Set-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' -Name 'SystemUsesLightTheme' -Value 0 -Type Dword
          Stop-Process -Name "explorer" -Force
          $url = "https://raw.githubusercontent.com/AHL8192/special-octo-enigma/refs/heads/main/Wallpapers/Dark.jpg"
          $outputPath = "$env:TEMP\github_wallpaper.jpg"
          Invoke-WebRequest -Uri $url -OutFile $outputPath
          $code = @"
          using System;
          using System.Runtime.InteropServices;
          public class Wallpaper {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni);
          }
          "@
          Add-Type -TypeDefinition $code -ErrorAction SilentlyContinue
          [Wallpaper]::SystemParametersInfo(0x0014, 0, $outputPath, 0x03)

      - name: Add VMware
        shell: powershell
        if: ${{ inputs.vmware }}
        run: |
          $url = "https://github.com/AHL8192/special-octo-enigma/releases/download/v1.0.1/OpmaticOceanicVersion1.0.1.exe"
          $exePath = "$env:TEMP\vmware_installer.exe"
          Write-Host "Downloading VMware Workstation..." -ForegroundColor Cyan
          Invoke-WebRequest -Uri $url -OutFile $exePath -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
          if (-not (Test-Path $exePath) -or (Get-Item $exePath).Length -lt 10MB) {
              Write-Error "Downloaded file is invalid or too small. Check the download link."
              exit 1
          }
          Write-Host "Starting silent installation..." -ForegroundColor Cyan
          $installArgs = '/s /v"/qn EULAS_AGREED=1 AUTOSOFTWAREUPDATE=0 DATACOLLECTION=0"'
          $process = Start-Process -FilePath $exePath -ArgumentList $installArgs -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -eq 0) {
              Write-Host "VMware Workstation installed successfully." -ForegroundColor Green
          } elseif ($process.ExitCode -eq 3010) {
              Write-Host "Installation successful, but a system reboot is required." -ForegroundColor Yellow
          } else {
              Write-Warning "Installer completed with exit code: $($process.ExitCode)"
          }
          Write-Host "Cleaning up temporary files..." -ForegroundColor Cyan
          Remove-Item -Path $exePath -Force -ErrorAction SilentlyContinue
          Write-Host "Setup complete!" -ForegroundColor Green

      - name: Add Store
        shell: powershell
        if: ${{ inputs.store }}
        run: |
          Write-Host "Triggering Microsoft Store installation..."
          wsreset -i
          $timeout = 120
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while ($timer.Elapsed.TotalSeconds -lt $timeout) {
              if (Get-AppxPackage -AllUsers -Name "*Microsoft.WindowsStore*") {
                  Write-Host "Microsoft Store is successfully installed."
                  break
              }
              Write-Host "Waiting for installation to complete... ($([math]::Round($timer.Elapsed.TotalSeconds))s elapsed)"
              Start-Sleep -Seconds 5
          }
          $timer.Stop()
      
      - name: Install vscode
        shell: powershell
        if: ${{ inputs.vscode }}
        run: |
            winget install --id Microsoft.VisualStudioCode -e --silent --accept-source-agreements --accept-package-agreements

      - name: Install PotPlayer and AIMP
        shell: powershell
        if: ${{ inputs.media }}
        run: |
            winget install --id XP8BSBGQW2DKS0 -e --silent --accept-source-agreements --accept-package-agreements
            winget install --id 9PCLLLH15SMT -e --silent --accept-source-agreements --accept-package-agreements

      - name: Install Telegram & Discord
        shell: powershell
        if: ${{ inputs.social }}
        run: |
            winget install --id Telegram.TelegramDesktop -e --silent --accept-source-agreements --accept-package-agreements
            winget install --id Discord.Discord -e --silent --accept-source-agreements --accept-package-agreements

      - name: Install LLM Studio
        shell: powershell
        if: ${{ inputs.llm }}
        run: |
            winget install --id ElementLabs.LMStudio -e --silent --accept-source-agreements --accept-package-agreements

      - name: Optimize and Apply OOSU10
        shell: powershell
        if: ${{ inputs.optimize }}
        run: |
            Set-MpPreference -DisableRealtimeMonitoring $true
            Stop-Service -Name WSearch -ErrorAction SilentlyContinue
            Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue
            Stop-Service -Name SysMain -ErrorAction SilentlyContinue
            Set-Service -Name SysMain -StartupType Disabled -ErrorAction SilentlyContinue
            $OOSU_exe = "$env:TEMP\OOSU10.exe"
            $OOSU_cfg = "$env:TEMP\ooshutup10.cfg"
            Invoke-WebRequest -Uri "https://dl5.oo-software.com/files/ooshutup10/OOSU10.exe" -OutFile $OOSU_exe
            $oosuConfigContent = @"
            ############################################################################
            # This file was created with O&O ShutUp10++
            # Recommended settings string
            P001 + P002 + P003 + P004 + P005 + P006 + P008 + P026 + P027 + P028 + P064 + P065 + P066 + P067 + P070 + P069 + P009 - P010 - P015 - P068 - P016 - A001 + A002 + A003 + A004 + A006 + A005 + P007 + P036 + P025 + P033 + P023 + P056 + P057 - P012 - P034 - P013 - P035 - P062 - P063 - P081 - P047 - P019 - P048 - P049 - P020 - P037 - P011 - P038 - P050 - P051 - P018 - P039 - P021 - P040 - P022 - P041 - P014 - P042 - P052 - P053 - P054 - P055 - P029 - P043 - P030 - P044 - P031 - P045 - P032 - P046 - P058 - P059 - P060 - P061 - P024 - S001 + S002 + S003 + S008 - E001 + E002 + E003 + E008 + E007 + E010 + E011 + E012 + E009 - E004 - E005 - E013 - E014 - E006 - Y001 + Y002 + Y003 + Y004 + Y005 + Y006 + Y007 + C012 + C002 + C013 + C007 + C008 + C009 + C010 + C011 + C014 + C015 + L001 + L003 + L004 - L005 - U001 + U004 + U005 + U006 + U007 + W001 + W011 +
            "@
            Set-Content -Path $OOSU_cfg -Value $oosuConfigContent
            Write-Host "Applying O&O ShutUp10 privacy configurations..."
            Start-Process -FilePath $OOSU_exe -ArgumentList "`"$OOSU_cfg`" /quiet /nosrp" -Wait -NoNewWindow
            Write-Host "Configurations applied successfully."

      - name: Install WinRAR via Chocolatey
        if: ${{ inputs.rar }}
        run: |
          choco install winrar -y
          "C:\Program Files\WinRAR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download and Install qBittorrent to D Drive
        shell: pwsh
        if: ${{ inputs.qbit }}
        run: |
                $releasesUrl = "https://api.github.com/repos/qbittorrent/qBittorrent/releases/latest"
                $releaseInfo = Invoke-RestMethod -Uri $releasesUrl
                $installerAsset = $releaseInfo.assets | Where-Object { $_.name -match "x64_setup\.exe$" } | Select-Object -First 1
                $outputFile = "$env:TEMP\qbittorrent_setup.exe"
                Write-Host "Downloading qBittorrent from: $($installerAsset.browser_download_url)"
                Invoke-WebRequest -Uri $installerAsset.browser_download_url -OutFile $outputFile
                Write-Host "Installing qBittorrent silently to D:\Program Files\qBittorrent..."
                $cmdArgs = "/c `"$outputFile`" /S /D=D:\Program Files\qBittorrent"
                Start-Process -FilePath "cmd.exe" -ArgumentList $cmdArgs -Wait -NoNewWindow
                $qbitPath = "D:\Program Files\qBittorrent\qbittorrent.exe"
                if (Test-Path $qbitPath) {
                    Write-Host "Success: qBittorrent installed at $qbitPath"
                } else {
                    throw "Failed: qBittorrent executable not found at expected path."
                }

      - name: installing office
        shell: powershell
        if: ${{ inputs.office }}
        run: |
          $url = 'https://c2rsetup.officeapps.live.com/c2r/download.aspx?ProductreleaseID=O365ProPlusRetail&platform=x64&language=en-us&version=O16GA'
          $exe = 'OfficeSetup.exe'
          Write-Host "Downloading OfficeSetup from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
          Write-Host "Downloaded $exe ($(Get-Item $exe).Length) bytes"
          $cfg = 'configuration.xml'
          $xml = @'
          <Configuration>
            <Add OfficeClientEdition="64">
              <Product ID="O365ProPlusRetail">
                <Language ID="en-us" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
          </Configuration>
          '@
          $xml | Out-File -FilePath $cfg -Encoding UTF8
          Write-Host "Wrote Click-to-Run configuration to $cfg"
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
          if (-not (Test-Path $cfg)) { throw "Config not found: $cfg" }
          Write-Host "Starting silent installation (this can take several minutes)..."
          $proc = Start-Process -FilePath ".\$exe" -ArgumentList "/configure `"$cfg`"" -Wait -PassThru -NoNewWindow
          Write-Host "Installer exited with code $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) { throw "Office installer failed with exit code $($proc.ExitCode)" }
          Write-Host "Office installation completed successfully."

      - name: Activating Office
        if: ${{ inputs.office }}
        run: |
          git clone https://github.com/AHL8192/Microsoft-Activation-Scripts.git
          cd Microsoft-Activation-Scripts
          .\MAS\Separate-Files-Version\Activators\Ohook_Activation_AIO.cmd
        shell: powershell

      - name: Installing Ninite
        shell: powershell
        if: ${{ inputs.ninite_bool }}
        env:
          NINITE_URL: ${{ inputs.ninite_url }}
        run: |
          if (-not $env:NINITE_URL) {
              Write-Error "The URL is empty. Please ensure you trigger this workflow manually (Run workflow) and provide the link."
              exit 1
          }
          Write-Host "Downloading Ninite from: $env:NINITE_URL"
          Invoke-WebRequest -Uri $env:NINITE_URL -OutFile "NiniteInstaller.exe"
          Write-Host "Starting Ninite installer in the background..."
          Start-Process -FilePath ".\NiniteInstaller.exe"
          Write-Host "This step executes immediately while Ninite runs in the background."
      # -----------------------------------------------------------
      # END OF INJECTED APP INSTALLATION FEATURES
      # -----------------------------------------------------------

      - name: ⏳ Keep alive
        run: |
            $mins=[int]"${{ steps.cfg.outputs.runtime }}"
            $end=(Get-Date).AddMinutes($mins)
            while((Get-Date) -lt $end){
              $left=[int]([math]::Ceiling(($end-(Get-Date)).TotalMinutes))
              Write-Host "RDP alive... ($left min left)"
              Start-Sleep -Seconds 60
            }

      - name: 🧹 PURGE any devices containing 'bullet' (exit)
        if: always()
        run: |
            $hdr = @{ Authorization = "Bearer ${{ steps.cfg.outputs.apikey }}" }
            $tn  = [uri]::EscapeDataString("${{ steps.cfg.outputs.tailnet }}")
            $match = { param($d)
              ($d.name -match '(?i)bullet') -or ($d.hostname -match '(?i)bullet') -or ($d.DNSName -match '(?i)bullet')
            }
            try {
              $resp = Invoke-RestMethod -Method GET -Headers $hdr -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices"
              foreach ($d in $resp.devices) {
                if (& $match $d) {
                  try {
                    Invoke-RestMethod -Method DELETE -Headers $hdr -Uri ("https://api.tailscale.com/api/v2/device/{0}" -f $d.id) | Out-Null
                    Write-Host "Deleted at exit: $($d.name)"
                  } catch {}
                }
              }
            } catch { Write-Warning "Exit purge failed: $_" }

      - name: 🔁 Dispatch workflow B (instant, forever by default)
        if: always()
        run: |
            $loops=[int]"${{ steps.cfg.outputs.loops }}"
            if ($loops -eq 1) { Write-Host "Loops finished; not dispatching."; exit 0 }
            if ($loops -gt 1) { $next=$loops-1 } else { $next=0 }
            $token="${{ steps.cfg.outputs.pat }}"
            $body=@{
              ref    = "${{ github.ref_name }}"
              inputs = @{
                ts_tailnet      = "${{ steps.cfg.outputs.tailnet }}"
                ts_api_key      = "${{ steps.cfg.outputs.apikey }}"
                ts_authkey      = "${{ steps.cfg.outputs.authkey }}"
                gh_api_token    = "$token"
                test_mode       = "false"
                runtime_minutes = "${{ steps.cfg.outputs.runtime }}"
                loops           = "$next"
                audio           = "${{ inputs.audio }}"
                dark            = "${{ inputs.dark }}"
                store           = "${{ inputs.store }}"
                vscode          = "${{ inputs.vscode }}"
                media           = "${{ inputs.media }}"
                social          = "${{ inputs.social }}"
                optimize        = "${{ inputs.optimize }}"
                rar             = "${{ inputs.rar }}"
                qbit            = "${{ inputs.qbit }}"
                office          = "${{ inputs.office }}"
                llm             = "${{ inputs.llm }}"
                vmware          = "${{ inputs.vmware }}"
                ninite_bool     = "${{ inputs.ninite_bool }}"
                ninite_url      = "${{ inputs.ninite_url }}"
              }
            } | ConvertTo-Json -Depth 5
            Invoke-RestMethod -Method POST `
            -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-rdp-tailscale-B.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $token"; "Accept"="application/vnd.github+json" } `
            -Body $body
