name: Setup LLM Runner + Tailscale

on:
  workflow_dispatch:
    inputs:
      ollama_model:
        description: 'Choose a model from https://ollama.com/library'
        required: true
        default: 'llama3.1'
        type: string

permissions:
  contents: read

jobs:
  setup-llm-runner:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: gh-llm-${{ github.run_id }}
      MODEL: ${{ inputs.ollama_model }}

    steps:
      - uses: actions/checkout@v4

      - name: Ensure runner user has sudo + password
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      - name: Install OpenSSH server & Tmux
        run: |
          echo ">>> Installing OpenSSH & Tmux..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server tmux
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Configure Auto-Attach for SSH
        run: |
          echo ">>> Adding tmux auto-attach to .bashrc..."
          cat << 'EOF' >> ~/.bashrc
          
          # Auto-attach to Ollama tmux session if connecting via SSH
          if [[ -z "$TMUX" ]] && [[ -n "$SSH_CONNECTION" ]]; then
              tmux attach-session -t llm_session 2>/dev/null || true
          fi
          EOF

      - name: Install Tailscale
        run: |
          echo ">>> Installing Tailscale..."
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      - name: Install Ollama
        run: |
          echo ">>> Installing dependencies..."
          sudo apt update -y -qq
          sudo apt install curl wget -y -qq
          
          echo ">>> Installing Ollama..."
          curl -sSL https://ollama.com/install.sh | sh
          
          echo ">>> Version Check:"
          ollama --version

      - name: Pull and Background Model
        run: |
          echo ">>> Pulling model: ${MODEL} (this may take a few minutes)..."
          ollama pull ${MODEL}

          echo ">>> Starting interactive session in tmux background..."
          sudo -u ${USERNAME} tmux new-session -d -s llm_session "ollama run ${MODEL}"

      - name: Show Connection Info
        run: |
          TAILSCALE_IP=$(tailscale ip -4 | head -n1)
          echo "=== SSH & LLM CONNECTION INFO ==="
          echo "IP: ${TAILSCALE_IP}"
          echo "USERNAME: ${USERNAME}"
          echo "PASSWORD: ${PASSWORD}"
          echo
          echo ">>> Connect via SSH (Ollama will auto-launch):"
          echo "    ssh -o StrictHostKeyChecking=no ${USERNAME}@${TAILSCALE_IP}"
          echo
          echo ">>> To detach from Ollama and use the terminal, press:"
          echo "    Ctrl+b, then d"
          echo
          echo ">>> To return to Ollama later, type:"
          echo "    tmux attach -t llm_session"
          echo
          echo ">>> Keeping runner alive..."
          tail -f /dev/null
